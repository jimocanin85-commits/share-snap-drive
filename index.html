  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Force external browser for Facebook/Instagram in-app browsers -->
    <script>
      (function() {
        const isInAppBrowser = /FBAN|FBAV|Instagram/i.test(navigator.userAgent);
        const hasRedirected = sessionStorage.getItem('hasRedirected');
        
        if (isInAppBrowser && !hasRedirected) {
          sessionStorage.setItem('hasRedirected', 'true');
          
          const currentUrl = window.location.href;
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          const isAndroid = /Android/.test(navigator.userAgent);
          
          if (isIOS) {
            // For iOS: Try to open in Safari
            window.location.href = 'x-safari-' + currentUrl;
            
            // Fallback: Show instructions after a delay
            setTimeout(() => {
              alert('Åbn denne side i Safari for bedste oplevelse.\n\nTryk på menuen (•••) og vælg "Åbn i Safari"');
            }, 1000);
          } else if (isAndroid) {
            // For Android: Try to open in Chrome
            window.location.href = 'intent://' + currentUrl.replace(/https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
            
            // Fallback: Show instructions after a delay
            setTimeout(() => {
              alert('Åbn denne side i Chrome for bedste oplevelse.\n\nTryk på menuen (⋮) og vælg "Åbn i Chrome"');
            }, 1000);
          }
        }
      })();
    </script>
  </body>
</html>
