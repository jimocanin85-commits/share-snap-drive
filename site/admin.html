<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR-kode – {event}</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/admin.js"></script>
  </head>
  <body>
    <main class="page">
      <div class="card stack center" style="max-width: 34rem">
        <div class="stack" style="--gap: 0.375rem">
          <h1><span data-event-name>Frivilligfesten 2026</span></h1>
          <p class="muted no-print">QR-kode til uploadsiden</p>
          <p class="print-only" hidden>Scan koden og del dine billeder fra festen</p>
        </div>

        <div class="field no-print">
          <label for="code">Event-kode</label>
          <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Samme som EVENT_CODE i Supabase" />
          <p class="tiny muted" id="code-hint"></p>
        </div>

        <div class="qr-box"><canvas id="qr" width="1000" height="1000" aria-label="QR-kode"></canvas></div>

        <div class="stack no-print" style="--gap: 0.375rem">
          <p class="small" style="font-weight: 600">Upload-adresse</p>
          <code class="url" id="url"></code>
        </div>

        <div class="btn-row no-print">
          <button class="btn" id="download-btn" type="button"><span data-icon="download"></span>Download QR-kode</button>
          <button class="btn btn-outline" id="print-btn" type="button"><span data-icon="printer"></span>Print</button>
        </div>
        <div class="btn-row no-print">
          <a class="btn btn-outline" href="/gallery"><span data-icon="images"></span>Se billederne</a>
        </div>

        <div class="tiny muted stack no-print" style="--gap: 0.25rem">
          <p>Print QR-koden og hæng den op, hvor gæsterne nemt kan se den.</p>
          <p>Når de scanner, kommer de direkte til siden, hvor de kan uploade billeder.</p>
        </div>
      </div>
    </main>
  </body>
</html>
