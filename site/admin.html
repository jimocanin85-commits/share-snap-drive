<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR-kode – {event}</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1a0e10" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/admin.js"></script>
  </head>
  <body>
    <main class="page">
      <div class="panel stack">
        <div class="panel-head">
          <img src="/assets/logo.png" alt="MB" width="720" height="794" />
          <div>
            <h1 class="display panel-title" data-event-name>Frivilligfesten 2027</h1>
            <p class="muted no-print">QR-kode til uploadsiden</p>
          </div>
        </div>
        <p class="print-only" hidden>Scan koden og del dine billeder fra festen</p>


        <div class="qr-box"><canvas id="qr" width="1000" height="1000" aria-label="QR-kode"></canvas></div>

        <div class="no-print stack" style="--gap: 0.4rem">
          <p class="small" style="font-weight: 700">Upload-adresse</p>
          <code class="url" id="url"></code>
        </div>

        <div class="btn-row no-print">
          <button class="btn" id="download-btn" type="button"><span data-icon="download"></span>Download QR-kode</button>
          <button class="btn btn-outline" id="print-btn" type="button"><span data-icon="printer"></span>Print</button>
        </div>
        <div class="btn-row no-print" style="--gap: 0.75rem">
          <a class="btn btn-outline" href="/slideshow"><span data-icon="play"></span>Lysbilledshow</a>
          <a class="btn btn-outline" href="/gallery"><span data-icon="images"></span>Se billederne</a>
        </div>

        <p class="tiny muted no-print">
          Print QR-koden og hæng den op, hvor gæsterne kan se den. Når de scanner den, kommer de direkte til uploadsiden.
        </p>
      </div>
    </main>
  </body>
</html>
