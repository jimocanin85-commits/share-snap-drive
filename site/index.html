<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{event} – Del dine billeder</title>
    <meta name="description" content="Upload og del dine billeder fra festen." />
    <meta name="theme-color" content="#1a0e10" />
    <meta property="og:title" content="Del dine billeder fra festen" />
    <meta property="og:description" content="Upload dine billeder direkte fra telefonen." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/assets/icon-32.png?v=mb2" type="image/png" sizes="32x32" />
    <link rel="icon" href="/assets/icon-16.png?v=mb2" type="image/png" sizes="16x16" />
    <link rel="icon" href="/assets/icon-192.png?v=mb2" type="image/png" sizes="192x192" />
    <link rel="shortcut icon" href="/favicon.ico?v=mb2" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preload" href="/assets/fonts/big-shoulders-display.woff" as="font" type="font/woff" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/upload.js"></script>
  </head>
  <body>
    <main class="up">
      <div class="wall" id="wall" aria-hidden="true"></div>

      <div class="up-inner">
        <header class="up-hero">
          <img class="up-logo" src="/assets/logo.png" alt="MB" width="720" height="794" />
          <div class="up-heading">
            <h1 class="display up-title" data-event-name>Frivilligfesten 2027</h1>
            <p class="up-lede">Del dine billeder fra aftenen. De kommer i galleriet og op på storskærmen.</p>
          </div>
        </header>

        <div class="up-panel">
          <div class="up-actions">
            <label class="pick" id="dropzone">
              <span data-icon="camera"></span>
              <span class="pick-title">Vælg billeder</span>
              <span class="pick-hint" id="limit-hint"></span>
              <input id="file-input" class="visually-hidden" type="file" accept="image/*,.heic,.heif" multiple />
            </label>

            <section class="selection" id="selection" hidden aria-label="Valgte billeder">
              <div class="selection-head">
                <span id="selection-count"></span>
                <button class="btn btn-ghost" id="clear-btn" type="button">Ryd alle</button>
              </div>
              <ul class="thumbs" id="thumbs"></ul>
            </section>

            <div class="send" id="send" hidden>
              <button class="btn btn-big" id="upload-btn" type="button" disabled>
                <span data-icon="upload"></span>
                <span id="upload-label">Upload</span>
              </button>
            </div>

            <div id="progress-wrap" hidden>
              <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Upload">
                <div id="progress-bar"></div>
              </div>
              <p class="small muted" id="progress-text" style="margin-top: 0.5rem"></p>
            </div>

            <div id="status" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
